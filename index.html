<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <section class="login-card" aria-label="Login form card">
      <h1>Login</h1>

      <form class="login-form" action="#" method="post">
        <label for="username">Username</label>
        <div class="field">
          <i class="fa-regular fa-user"></i>
          <input id="username" name="username" type="text" placeholder="Type your username" required />
        </div>

        <label for="password">Password</label>
        <div class="field">
          <i class="fa-solid fa-lock"></i>
          <input id="password" name="password" type="password" placeholder="Type your password" required />
        </div>

        <a class="forgot-link" href="#">Forgot password?</a>
        <button type="submit">LOGIN</button>
      </form>

      <p class="hint">Or Sign Up Using</p>
      <div class="socials" aria-label="Social sign in options">
        <a class="social facebook" href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
        <a class="social twitter" href="#" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
        <a class="social google" href="#" aria-label="Google"><i class="fa-brands fa-google"></i></a>
      </div>

      <p class="hint bottom">Or Sign Up Using</p>
      <a class="signup-link" href="#">SIGN UP</a>
    </section>
  </main>
</body>
</html>
